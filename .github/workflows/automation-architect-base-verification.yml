name: Automation Architect Base Verification

on:
  push:
    branches:
      - feat/automation-ir

permissions:
  contents: write

concurrency:
  group: automation-architect-base-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/automation-ir
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install package dependencies
        run: bun install --frozen-lockfile --filter @activepieces/automation-architect

      - name: Confirm committed lockfile is stable
        run: |
          if ! git diff --quiet -- bun.lock; then
            echo "::error::bun.lock changed during frozen install"
            git diff -- bun.lock
            exit 1
          fi

      - name: Install repository lint tooling
        run: bun add --no-save --dev eslint@8.57.0 @typescript-eslint/eslint-plugin@7.18.0 @typescript-eslint/parser@7.18.0 eslint-plugin-unused-imports@4.4.1

      - name: Build Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run build

      - name: Lint Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run lint

      - name: Test Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run test
