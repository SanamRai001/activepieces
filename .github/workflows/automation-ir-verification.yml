name: Automation IR Verification

on:
  pull_request:
    branches:
      - feat/automation-architect-foundation

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'feat/automation-ir' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Commit generated lockfile when needed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: update bun lock for Automation IR"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Build Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run build

      - name: Lint Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run lint

      - name: Test Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run test
