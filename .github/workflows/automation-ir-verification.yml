name: Automation IR Verification

on:
  pull_request:
    branches:
      - feat/automation-architect-foundation

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'feat/automation-ir'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Check lockfile drift
        id: lockfile
        continue-on-error: true
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is unchanged"
          else
            echo "::error::bun.lock changed after bun install"
            git diff --unified=5 -- bun.lock
            exit 1
          fi

      - name: Build Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run build

      - name: Lint Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run lint

      - name: Test Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run test

      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-ir-bun-lock
          path: bun.lock
          retention-days: 1

      - name: Fail on lockfile drift
        if: always()
        run: |
          if [ "${{ steps.lockfile.outcome }}" != "success" ]; then
            echo "bun.lock must be committed for the new workspace package"
            exit 1
          fi
