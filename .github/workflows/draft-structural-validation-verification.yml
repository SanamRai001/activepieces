name: Draft Structural Validation Verification

on:
  push:
    branches:
      - feat/draft-structural-validation

permissions:
  contents: read

concurrency:
  group: draft-structural-validation-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/draft-structural-validation
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Build API through workspace dependency graph
        run: bunx turbo run build --filter=api

      - name: Lint Phase 5A files
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          bunx eslint \
            'packages/server/api/src/app/flows/validation/flow-structure-validation.ts' \
            'packages/server/api/src/app/automation-architect/draft-validation.service.ts' \
            'packages/server/api/src/app/mcp/tools/ap-validate-flow.ts' \
            'packages/server/api/test/unit/app/flows/validation/flow-structure-validation.test.ts' \
            'packages/server/api/test/unit/automation-architect/draft-validation.service.test.ts'

      - name: Test structural validation
        working-directory: packages/server/api
        run: |
          bunx vitest run \
            test/unit/app/flows/validation/flow-structure-validation.test.ts \
            test/unit/automation-architect/draft-validation.service.test.ts
