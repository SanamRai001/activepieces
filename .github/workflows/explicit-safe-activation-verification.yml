name: Explicit Safe Activation Verification

on:
  push:
    branches:
      - feat/explicit-safe-activation

permissions:
  contents: read

concurrency:
  group: explicit-safe-activation-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/explicit-safe-activation
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Build API with workspace dependencies
        run: bunx turbo run build --filter=api

      - name: Lint activation safety changes
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          bunx eslint \
            'packages/server/api/src/app/automation-architect/activation-policy.ts' \
            'packages/server/api/src/app/automation-architect/activation-audit.entity.ts' \
            'packages/server/api/src/app/automation-architect/activation-readiness.ts' \
            'packages/server/api/src/app/automation-architect/activation-readiness.service.ts' \
            'packages/server/api/src/app/automation-architect/activation.service.ts' \
            'packages/server/api/src/app/automation-architect/activation.controller.ts' \
            'packages/server/api/src/app/automation-architect/automation-architect.module.ts' \
            'packages/server/api/src/app/automation-architect/draft-validation.service.ts' \
            'packages/server/api/src/app/flows/flow/flow.service.ts' \
            'packages/server/api/src/app/database/migration/postgres/1859000000000-AddAutomationActivationAuditAndRevision.ts' \
            'packages/server/api/test/unit/automation-architect/activation-readiness.test.ts' \
            'packages/server/api/test/unit/automation-architect/activation.service.test.ts' \
            'packages/server/api/test/unit/automation-architect/draft-validation.service.test.ts'

      - name: Test activation and validation regressions
        working-directory: packages/server/api
        run: |
          bunx vitest run \
            test/unit/automation-architect/activation-readiness.test.ts \
            test/unit/automation-architect/activation.service.test.ts \
            test/unit/automation-architect/draft-validation.service.test.ts \
            test/unit/automation-architect/draft-simulation.service.test.ts

      - name: Check database migration/schema alignment
        run: bunx turbo run check-migrations --filter=api
