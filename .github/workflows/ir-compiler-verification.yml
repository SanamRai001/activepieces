name: IR Compiler Verification

on:
  push:
    branches:
      - feat/activepieces-ir-compiler

permissions:
  contents: read

concurrency:
  group: ir-compiler-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/activepieces-ir-compiler
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Build API through workspace dependency graph
        run: bunx turbo run build --filter=api

      - name: Lint IR compiler files
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          bunx eslint \
            'packages/server/api/src/app/automation-architect/ir-compiler.ts' \
            'packages/server/api/src/app/automation-architect/ir-compiler.service.ts' \
            'packages/server/api/test/unit/automation-architect/ir-compiler.test.ts'

      - name: Test Automation Architect compiler
        working-directory: packages/server/api
        run: bunx vitest run test/unit/automation-architect/ir-compiler.test.ts test/unit/automation-architect/capability-discovery.service.test.ts
