name: Planner Verification

on:
  pull_request:
    branches:
      - feat/automation-ir

permissions:
  contents: read

concurrency:
  group: planner-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'feat/natural-language-planner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter @activepieces/automation-architect

      - name: Confirm committed lockfile is stable
        run: |
          if ! git diff --quiet -- bun.lock; then
            echo "::error::bun.lock changed during frozen install"
            git diff -- bun.lock
            exit 1
          fi

      - name: Install isolated lint tooling
        run: |
          mkdir -p /tmp/automation-architect-lint
          cd /tmp/automation-architect-lint
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund eslint@8.57.0 typescript@5.5.4 @typescript-eslint/eslint-plugin@7.18.0 @typescript-eslint/parser@7.18.0 eslint-plugin-unused-imports@4.4.1 typescript@5.5.4

      - name: Build Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run build

      - name: Lint Automation Architect core
        run: /tmp/automation-architect-lint/node_modules/.bin/eslint 'packages/core/automation-architect/src/**/*.ts' 'packages/core/automation-architect/test/**/*.ts' --resolve-plugins-relative-to /tmp/automation-architect-lint/node_modules

      - name: Test Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run test
