name: Planner Verification

on:
  pull_request:
    branches:
      - feat/automation-ir

permissions:
  contents: read

concurrency:
  group: planner-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'feat/natural-language-planner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run build

      - name: Lint Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run lint

      - name: Test Automation Architect core
        working-directory: packages/core/automation-architect
        run: bun run test
