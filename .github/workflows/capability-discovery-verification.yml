name: Capability Discovery Verification

on:
  push:
    branches:
      - feat/activepieces-capability-discovery

permissions:
  contents: write

concurrency:
  group: capability-discovery-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/activepieces-capability-discovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install repository dependencies with pinned toolchain
        run: bun install --frozen-lockfile

      - name: Build API through workspace dependency graph
        run: bunx turbo run build --filter=api

      - name: Lint capability discovery files
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          bunx eslint \
            'packages/server/api/src/app/automation-architect/capability-discovery.ts' \
            'packages/server/api/src/app/automation-architect/capability-discovery.service.ts' \
            'packages/server/api/test/unit/automation-architect/capability-discovery.service.test.ts'

      - name: Test capability discovery adapter
        working-directory: packages/server/api
        run: bunx vitest run test/unit/automation-architect/capability-discovery.service.test.ts
